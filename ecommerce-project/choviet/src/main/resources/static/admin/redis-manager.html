<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redis Management - ChoViet</title>    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="redis-manager.css" rel="stylesheet">
    <style>
        .key-item {
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        .key-item:hover {
            border-left-color: #007bff;
            background-color: #f8f9fa;
        }
        .key-type-badge {
            font-size: 0.75rem;
        }
        .ttl-badge {
            font-size: 0.75rem;
        }
        .json-viewer {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 1rem;
            font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 300px;
            background-color: #343a40;
            color: white;
            overflow-y: auto;
        }
        .main-content {
            margin-left: 300px;
            padding: 20px;
        }
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .danger-zone {
            border: 2px solid #dc3545;
            border-radius: 0.5rem;
            background-color: #fff5f5;
        }
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
                height: auto;
                position: relative;
            }
            .main-content {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar p-3">
        <h4 class="mb-4">
            <i class="fas fa-database me-2"></i>
            Redis Manager
        </h4>
        
        <!-- Search -->
        <div class="mb-3">
            <div class="input-group">
                <input type="text" id="searchPattern" class="form-control" placeholder="Pattern (e.g., user:*)" value="*">
                <button class="btn btn-outline-light" type="button" onclick="searchKeys()">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>

        <!-- Stats -->
        <div class="card stats-card mb-3">
            <div class="card-body">
                <h6 class="card-title">Thống kê</h6>
                <div id="redisStats">
                    <div class="d-flex justify-content-between">
                        <span>Tổng Keys:</span>
                        <span id="totalKeys">-</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Keys List -->
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Keys</span>
                <span class="badge bg-primary" id="keyCount">0</span>
            </div>
            <div class="card-body p-0" style="max-height: 400px; overflow-y: auto;">
                <div id="keysList"></div>
            </div>
        </div>

        <!-- Pagination -->
        <div class="mt-3">
            <nav>
                <ul class="pagination pagination-sm justify-content-center" id="pagination">
                </ul>
            </nav>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <div class="row mb-4">
            <div class="col">
                <h1 class="h3">Redis Key Management</h1>
                <p class="text-muted">Quản lý và theo dõi các Redis keys</p>
            </div>
            <div class="col-auto">
                <button class="btn btn-success" onclick="showAddKeyModal()">
                    <i class="fas fa-plus me-2"></i>Thêm Key
                </button>
                <button class="btn btn-outline-primary" onclick="refreshData()">
                    <i class="fas fa-refresh me-2"></i>Refresh
                </button>
            </div>
        </div>

        <!-- Key Details -->
        <div class="row">
            <div class="col-12">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <span>Chi tiết Key</span>
                        <div id="keyActions" style="display: none;">
                            <button class="btn btn-sm btn-warning" onclick="showEditKeyModal()">
                                <i class="fas fa-edit"></i> Sửa
                            </button>
                            <button class="btn btn-sm btn-info" onclick="showSetTTLModal()">
                                <i class="fas fa-clock"></i> TTL
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCurrentKey()">
                                <i class="fas fa-trash"></i> Xóa
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="keyDetails">
                            <div class="text-center text-muted py-5">
                                <i class="fas fa-key fa-3x mb-3"></i>
                                <p>Chọn một key để xem chi tiết</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Danger Zone -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="danger-zone p-3">
                    <h5 class="text-danger">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        Vùng Nguy Hiểm
                    </h5>
                    <p class="text-muted mb-3">Các thao tác này không thể hoàn tác</p>
                    <button class="btn btn-outline-danger" onclick="confirmFlushAll()">
                        <i class="fas fa-trash-alt me-2"></i>
                        Xóa Tất Cả Keys
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Key Modal -->
    <div class="modal fade" id="keyModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="keyModalTitle">Thêm Key</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="keyForm">
                        <div class="mb-3">
                            <label for="keyName" class="form-label">Key Name</label>
                            <input type="text" class="form-control" id="keyName" required>
                        </div>
                        <div class="mb-3">
                            <label for="keyValue" class="form-label">Value (JSON)</label>
                            <textarea class="form-control" id="keyValue" rows="5" required></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6">
                                <label for="keyTTL" class="form-label">TTL (optional)</label>
                                <input type="number" class="form-control" id="keyTTL" placeholder="Seconds">
                            </div>
                            <div class="col-md-6">
                                <label for="keyTTLUnit" class="form-label">Unit</label>
                                <select class="form-control" id="keyTTLUnit">
                                    <option value="SECONDS">Seconds</option>
                                    <option value="MINUTES">Minutes</option>
                                    <option value="HOURS">Hours</option>
                                    <option value="DAYS">Days</option>
                                </select>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="saveKey()">Lưu</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Set TTL Modal -->
    <div class="modal fade" id="ttlModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Set TTL</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="ttlValue" class="form-label">TTL Value</label>
                        <input type="number" class="form-control" id="ttlValue" required>
                    </div>
                    <div class="mb-3">
                        <label for="ttlUnit" class="form-label">Unit</label>
                        <select class="form-control" id="ttlUnit">
                            <option value="SECONDS">Seconds</option>
                            <option value="MINUTES">Minutes</option>
                            <option value="HOURS">Hours</option>
                            <option value="DAYS">Days</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                    <button type="button" class="btn btn-primary" onclick="setKeyTTL()">Set TTL</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="redis-manager.js"></script>
</body>
</html>
