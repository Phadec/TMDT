spring:
  rabbitmq:
    # Set to false to disable RabbitMQ integration
    enabled: true
    host: localhost
    port: 5672
    username: guest
    password: guest
    connection-timeout: 5000
    # More detailed error handling for RabbitMQ
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-interval: 10000ms
        multiplier: 2.0
        max-attempts: 3
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000ms
          max-interval: 10000ms
          multiplier: 2.0
          max-attempts: 3

  redis:
    host: localhost
    port: 6379
    timeout: 2000
    connect-timeout: 2000
    
  # Database configuration
  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_users?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 
    driver-class-name: com.mysql.cj.jdbc.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8081

# JWT Configuration
jwt:
  secret: mySecretKey123456789012345678901234567890
  expiration: 900000  # 15 minutes in milliseconds
  refresh-token:
    expiration: 86400000  # 24 hours in milliseconds

# Eureka
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
