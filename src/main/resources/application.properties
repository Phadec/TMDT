# Swagger-ui custom path
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.show-actuator=true
springdoc.swagger-ui.operationsSorter=method

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# Logging configuration
logging.level.com.example.trello=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# Additional Logging for Troubleshooting
logging.level.org.thymeleaf=TRACE
logging.level.com.example.trello.services.EmailService=DEBUG

# Enhanced Thymeleaf logging
logging.level.org.springframework.boot.autoconfigure.thymeleaf=TRACE

# Debug logging for template resolution
logging.level.org.springframework.web=DEBUG
logging.level.com.example.trello.config=DEBUG
logging.level.com.example.trello.services=DEBUG

# Detailed Thymeleaf logging
logging.level.org.springframework.web=DEBUG
logging.level.com.example.trello=DEBUG

