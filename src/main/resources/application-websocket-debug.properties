# Enable debug logging for Spring Security to help diagnose issues
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG

# More detailed logging for SockJS and STOMP
logging.level.org.springframework.web.socket.sockjs=TRACE
logging.level.org.springframework.messaging.simp.stomp=TRACE
